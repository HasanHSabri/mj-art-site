# Preview-only catalogue image + artworks.json import for MJ-ART.
#
# Private ORIGINAL masters are a versioned library on a hardened VPS (no Neon).
# The operator builds `mj-art-master-<version>.tar.gz` and a matching
# `mj-art-master-<version>.sha256` sidecar under the configured VPS_MASTER_ROOT.
# This workflow fetches BOTH over key-only, strict-host-checking SSH/SCP, parses
# the sidecar safely, RE-HASHES the archive bytes, and only then extracts.
#
# Public processed derivatives and the canonical artworks.json are published to
# the PREVIEW R2 bucket only (Cloudflare). The production bucket is never a
# valid target here. Production catalogue import remains blocked until the Stop 2
# milestone (see docs/OPERATIONS.md).
#
# The operator supplies only a `master_archive_version` token (never a URL). No
# archive URL or write URL appears anywhere in this workflow. All VPS connection
# material flows through GitHub variables/secrets -> env (never interpolated in a
# run script), and the run fails closed until those are configured.
#
# Read docs/OPERATIONS.md before changing anything here.

name: Catalog Import (Preview)

on:
  workflow_dispatch:
    inputs:
      confirm_preview_only:
        description: 'Required confirmation that this run targets PREVIEW ONLY. The run fails closed unless this is enabled.'
        required: true
        type: boolean
        default: false
      master_archive_version:
        description: 'Version token of the VPS master archive to fetch (e.g. 2026-08-01). Names mj-art-master-<version>.tar.gz + .sha256 under VPS_MASTER_ROOT. Strict [A-Za-z0-9._-]{1,64}.'
        required: true
        type: string
      execute_upload:
        description: 'When disabled (default) the run validates + generates + plans only. When enabled, uploads to PREVIEW after all gates pass.'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: catalog-import-preview
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  # Hard-coded preview bucket. This is the only bucket string this workflow may
  # reference; the import client rejects any other value.
  PREVIEW_BUCKET: mj-art-images-preview

jobs:
  catalog-import-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Fail closed unless preview-only scope + VPS attestation confirmed
        if: always()
        env:
          # All dispatch inputs, repo variables, and secrets flow through env
          # ONLY. None is ever interpolated inside a run script, so no value can
          # become shell syntax or be echoed.
          CONFIRM_INPUT: ${{ inputs.confirm_preview_only }}
          MASTER_VERSION: ${{ inputs.master_archive_version }}
          VPS_ASSETS_CONFIRMED: ${{ vars.VPS_ASSETS_CONFIRMED }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_MASTER_ROOT: ${{ vars.VPS_MASTER_ROOT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          PREVIEW_BUCKET: ${{ env.PREVIEW_BUCKET }}
        run: |
          set -euo pipefail
          # Always-running prerequisite gate. Production is never a valid target.
          if [ "${CONFIRM_INPUT}" != "true" ]; then
            echo "fail closed: dispatch input confirm_preview_only must be true"
            exit 1
          fi
          if [ "${PREVIEW_BUCKET}" != "mj-art-images-preview" ]; then
            echo "fail closed: PREVIEW_BUCKET must be exactly mj-art-images-preview"
            exit 1
          fi
          # Out-of-band maintainer attestation: the VPS account, key, host key,
          # and master root have been confirmed by a maintainer. Set LAST in the
          # one-time setup (see docs/OPERATIONS.md).
          if [ "${VPS_ASSETS_CONFIRMED}" != "true" ]; then
            echo "fail closed: repository variable VPS_ASSETS_CONFIRMED must be 'true' (one-time VPS attestation)"
            exit 1
          fi
          # Every required VPS variable and secret must be present and non-empty.
          # Values are never echoed; only their presence/shape is asserted.
          if [ -z "${VPS_HOST:-}" ]; then echo "fail closed: repository variable VPS_HOST is missing or empty"; exit 1; fi
          if [ -z "${VPS_PORT:-}" ]; then echo "fail closed: repository variable VPS_PORT is missing or empty"; exit 1; fi
          if [ -z "${VPS_USER:-}" ]; then echo "fail closed: repository variable VPS_USER is missing or empty"; exit 1; fi
          if [ -z "${VPS_MASTER_ROOT:-}" ]; then echo "fail closed: repository variable VPS_MASTER_ROOT is missing or empty"; exit 1; fi
          if [ -z "${VPS_SSH_PRIVATE_KEY:-}" ]; then echo "fail closed: repository secret VPS_SSH_PRIVATE_KEY is missing or empty"; exit 1; fi
          if [ -z "${VPS_KNOWN_HOSTS:-}" ]; then echo "fail closed: repository secret VPS_KNOWN_HOSTS is missing or empty"; exit 1; fi
          # master_archive_version: strict token, no slashes/spaces/metacharacters.
          if ! printf '%s' "${MASTER_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo "fail closed: master_archive_version must match [A-Za-z0-9._-]{1,64}"
            exit 1
          fi
          # VPS_HOST: hostname or IP (no scheme/port/path/whitespace).
          if ! printf '%s' "${VPS_HOST}" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'; then
            echo "fail closed: VPS_HOST must be a hostname or IP"
            exit 1
          fi
          # VPS_PORT: integer 1-65535.
          if ! printf '%s' "${VPS_PORT}" | grep -Eq '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'; then
            echo "fail closed: VPS_PORT must be an integer 1-65535"
            exit 1
          fi
          # VPS_USER: POSIX account name.
          if ! printf '%s' "${VPS_USER}" | grep -Eq '^[A-Za-z0-9._-]{1,32}$'; then
            echo "fail closed: VPS_USER must match [A-Za-z0-9._-]{1,32}"
            exit 1
          fi
          # VPS_MASTER_ROOT: absolute POSIX path, positive allowlist, no traversal.
          if ! printf '%s' "${VPS_MASTER_ROOT}" | grep -Eq '^/[A-Za-z0-9/_.-]*$'; then
            echo "fail closed: VPS_MASTER_ROOT must be an absolute POSIX path of [A-Za-z0-9/_.-]"
            exit 1
          fi
          case "${VPS_MASTER_ROOT}" in
            *..*) echo "fail closed: VPS_MASTER_ROOT must not contain parent traversal"; exit 1 ;;
          esac
          echo "preview-only scope + VPS attestation confirmed (connection values not echoed)"
          echo "Production catalogue import remains blocked until the Stop 2 milestone."

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install pnpm
        uses: pnpm/action-setup@a8198c4bff370c8506180b035930dea56dbd5288 # v5 (moving tag SHA, resolved via git ls-remote)

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure ImageMagick is available
        run: |
          set -euo pipefail
          if command -v magick >/dev/null 2>&1; then
            magick --version | head -n 1
          elif command -v convert >/dev/null 2>&1 && command -v identify >/dev/null 2>&1; then
            identify --version | head -n 1
          else
            echo "ImageMagick not found on runner; installing..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq imagemagick
            identify --version | head -n 1
          fi

      - name: Fetch master archive + sidecar from VPS and verify checksum
        env:
          # Connection material flows through env only (never interpolated in
          # this run script); values are written to runner-temp key/host files
          # with restrictive perms and never echoed.
          MASTER_VERSION: ${{ inputs.master_archive_version }}
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_PORT: ${{ vars.VPS_PORT }}
          VPS_USER: ${{ vars.VPS_USER }}
          VPS_MASTER_ROOT: ${{ vars.VPS_MASTER_ROOT }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # Re-assert input/var shapes on the consumed values (defense in depth).
          if ! printf '%s' "${MASTER_VERSION}" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo "fail closed: master_archive_version must match [A-Za-z0-9._-]{1,64}"; exit 1
          fi
          if ! printf '%s' "${VPS_HOST}" | grep -Eq '^[A-Za-z0-9]([A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'; then
            echo "fail closed: VPS_HOST must be a hostname or IP"; exit 1
          fi
          if ! printf '%s' "${VPS_PORT}" | grep -Eq '^([1-9][0-9]{0,3}|[1-5][0-9]{4}|6[0-4][0-9]{3}|65[0-4][0-9]{2}|655[0-2][0-9]|6553[0-5])$'; then
            echo "fail closed: VPS_PORT must be an integer 1-65535"; exit 1
          fi
          if ! printf '%s' "${VPS_USER}" | grep -Eq '^[A-Za-z0-9._-]{1,32}$'; then
            echo "fail closed: VPS_USER must match [A-Za-z0-9._-]{1,32}"; exit 1
          fi
          if ! printf '%s' "${VPS_MASTER_ROOT}" | grep -Eq '^/[A-Za-z0-9/_.-]*$'; then
            echo "fail closed: VPS_MASTER_ROOT must be an absolute POSIX path of [A-Za-z0-9/_.-]"; exit 1
          fi
          case "${VPS_MASTER_ROOT}" in *..*) echo "fail closed: VPS_MASTER_ROOT must not contain parent traversal"; exit 1 ;; esac

          ARCHIVE="${RUNNER_TEMP}/mj-art-master-${MASTER_VERSION}.tar.gz"
          SIDECAR="${RUNNER_TEMP}/mj-art-master-${MASTER_VERSION}.sha256"
          KEY_FILE="${RUNNER_TEMP}/vps_ed25519"
          KNOWN_HOSTS_FILE="${RUNNER_TEMP}/vps_known_hosts"

          # Stage the private key and the pinned host key with restrictive perms.
          # The secret contents are written straight to disk (never to stdout/log).
          umask 077
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          printf '%s\n' "${VPS_KNOWN_HOSTS}" > "$KNOWN_HOSTS_FILE"
          chmod 600 "$KNOWN_HOSTS_FILE"

          # Construct the EXACT remote basenames from the validated version only.
          REMOTE_ARCHIVE="mj-art-master-${MASTER_VERSION}.tar.gz"
          REMOTE_SIDECAR="mj-art-master-${MASTER_VERSION}.sha256"
          SCP_TARGET="${VPS_USER}@${VPS_HOST}"
          REMOTE_ARCHIVE_PATH="${SCP_TARGET}:${VPS_MASTER_ROOT}/${REMOTE_ARCHIVE}"
          REMOTE_SIDECAR_PATH="${SCP_TARGET}:${VPS_MASTER_ROOT}/${REMOTE_SIDECAR}"

          # Hardened SSH/SCP options as a bash ARRAY (no string word-splitting):
          # key-only auth, batch mode (no interactive prompts -> fail closed),
          # strict host checking against the pinned known_hosts, identity pinned.
          #
          # SECURITY: the mjart-fetch account is locked to a forced
          # "internal-sftp" authorized_keys command and cannot run a shell, so
          # scp MUST use its default SFTP protocol. Never add the legacy -O
          # (old SCP protocol) switch: it spawns a remote shell, which the
          # forced-command account denies, causing the fetch to fail closed.
          SCP_OPTS=(
            -P "${VPS_PORT}"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o PasswordAuthentication=no
            -o KbdInteractiveAuthentication=no
            -o PreferredAuthentications=publickey
            -o PubkeyAuthentication=yes
            -o UserKnownHostsFile="${KNOWN_HOSTS_FILE}"
            -o GlobalKnownHostsFile=/dev/null
            -o IdentitiesOnly=yes
            -o LogLevel=ERROR
            -i "${KEY_FILE}"
          )

          # Fetch sidecar first, then archive. scp fails closed on any error.
          scp "${SCP_OPTS[@]}" "${REMOTE_SIDECAR_PATH}" "${SIDECAR}"
          scp "${SCP_OPTS[@]}" "${REMOTE_ARCHIVE_PATH}" "${ARCHIVE}"

          # Verify the archive against the sidecar WITHOUT delegating to the
          # coreutils checksum-check subcommand (which would read an untrusted
          # path from the sidecar). The helper parses the sidecar strictly
          # (exact basename match) and re-hashes the archive bytes itself.
          node scripts/verify-master-archive.mjs \
            --version "${MASTER_VERSION}" \
            --archive "${ARCHIVE}" \
            --sidecar "${SIDECAR}"

          # The staged key is wiped as soon as the fetch succeeds.
          rm -f "$KEY_FILE"
          echo "master archive fetched from VPS and checksum-verified"

      - name: Extract archive (hardened) and locate SHA256SUMS root
        id: assets
        env:
          MASTER_VERSION: ${{ inputs.master_archive_version }}
        run: |
          set -euo pipefail
          ARCHIVE="${RUNNER_TEMP}/mj-art-master-${MASTER_VERSION}.tar.gz"
          EXTRACT="${RUNNER_TEMP}/catalog-assets"
          mkdir -p "$EXTRACT"
          # Pre-extraction safety: validate the verbose listing BEFORE extracting.
          # Rejects any symlink/hardlink entry (so extraction can never create a
          # link that escapes the target dir) and any absolute or parent-traversal
          # path. This runs before a single byte is written to $EXTRACT.
          tar -tvzf "$ARCHIVE" > "${RUNNER_TEMP}/catalog-listing.txt"
          node scripts/validate-archive-listing.mjs --verbose-listing "${RUNNER_TEMP}/catalog-listing.txt"
          # Extract with no owner/permission restoration (no privilege escalation).
          tar -xzf "$ARCHIVE" -C "$EXTRACT" --no-same-owner
          # The archive root may wrap the tree in one directory. Find the dir
          # that contains SHA256SUMS + originals/ + misc-originals/.
          ROOT="$(find "$EXTRACT" -type f -name SHA256SUMS -print0 \
            | while IFS= read -r -d '' f; do
                d="$(dirname "$f")"
                if [ -d "$d/originals" ] && [ -d "$d/misc-originals" ]; then
                  printf '%s\n' "$d"
                  break
                fi
              done)"
          if [ -z "$ROOT" ]; then
            echo "fail closed: archive does not contain SHA256SUMS + originals/ + misc-originals/"
            echo "expected layout: <root>/{originals,misc-originals}/, <root>/SHA256SUMS"
            exit 1
          fi
          echo "ASSETS_DIR=$ROOT" >> "$GITHUB_ENV"
          echo "assets root: $ROOT"

      # NOTE: there is intentionally no `sha256sum -c SHA256SUMS` step. That step
      # would read paths straight from the downloaded SHA256SUMS, which could
      # contain absolute or parent-traversal paths. It is also fully redundant:
      # the generator (generate-catalog-derivatives.mjs) parses SHA256SUMS via
      # the strict parseSha256Sums() helper (rejecting malformed lines and any
      # unsafe path), resolves each catalogue source solely through
      # provenance.sha256 via buildSourceMap(), and RE-HASHES every source byte
      # before generation. Relying on the generator's strict rehash removes the
      # unsafe-path-reading surface with no loss of integrity coverage.

      - name: Validate catalogue
        run: pnpm check:catalog

      - name: Validate operations policy
        run: pnpm check:operations

      - name: Generate derivatives
        run: |
          set -euo pipefail
          node scripts/generate-catalog-derivatives.mjs \
            --assets-dir "$ASSETS_DIR" \
            --output-dir "${RUNNER_TEMP}/derivatives"

      - name: Validate import plan (dry-run, no uploads)
        run: |
          set -euo pipefail
          node scripts/import-catalog-preview.mjs \
            --manifest "${RUNNER_TEMP}/derivatives/manifest.json" \
            --catalog catalog/catalog.json \
            --bucket "$PREVIEW_BUCKET"

      - name: Execute preview upload (images first, artworks.json last)
        if: ${{ inputs.execute_upload == true }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "fail closed: secret CLOUDFLARE_API_TOKEN is empty or missing"; exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "fail closed: secret CLOUDFLARE_ACCOUNT_ID is empty or missing"; exit 1
          fi
          node scripts/import-catalog-preview.mjs \
            --manifest "${RUNNER_TEMP}/derivatives/manifest.json" \
            --catalog catalog/catalog.json \
            --bucket "$PREVIEW_BUCKET" \
            --execute \
            --wrangler "pnpm exec wrangler"

      - name: Clean runner temp
        if: always()
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/derivatives" "${RUNNER_TEMP}/catalog-assets" \
                 "${RUNNER_TEMP}/mj-art-master-"* \
                 "${RUNNER_TEMP}/vps_ed25519" "${RUNNER_TEMP}/vps_known_hosts" \
                 "${RUNNER_TEMP}/catalog-listing.txt" || true
