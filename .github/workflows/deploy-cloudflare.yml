# Deploy to Cloudflare Workers
# Push/PR run checks only. Deployment is manual via workflow_dispatch only.
name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'archive/**'
      - '.opencode/**'
      - 'thoughts/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (preview by default; production requires explicit selection)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @mj-art/web build

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure MJ Art storage exists
        working-directory: apps/web
        run: |
          pnpm exec wrangler r2 bucket create mj-art-images --location apac || true
          pnpm exec wrangler r2 bucket create mj-art-images-preview --location apac || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure admin secrets
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${{ inputs.environment }}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

          printf '%s' "$ADMIN_PASSWORD" | pnpm exec wrangler secret put ADMIN_PASSWORD "${deploy_args[@]}"
          printf '%s' "$ADMIN_SESSION_SECRET" | pnpm exec wrangler secret put ADMIN_SESSION_SECRET "${deploy_args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${{ inputs.environment }}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

          pnpm exec wrangler deploy "${deploy_args[@]}" | tee deploy.log

          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            case "${{ inputs.environment }}" in
              preview)
                DEPLOY_URL="https://mj-art-preview.drhasansabri.workers.dev"
                ;;
              production)
                DEPLOY_URL="https://mj-art.drhasansabri.workers.dev"
                ;;
              *)
                echo "Unsupported environment: ${{ inputs.environment }}" >&2
                exit 1
                ;;
            esac
          fi

          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          sleep 15

          URL="$DEPLOY_URL"

          HEALTH_URL="$URL/api/health"

          echo "Checking deployment health at: $HEALTH_URL"

          for i in {1..6}; do
            response=$(curl -sS -w "\n%{http_code}" "$HEALTH_URL" || echo -e "\n000")
            code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')

            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"healthy"'; then
              echo "Deployment verified successfully!"
              exit 0
            fi

            echo "Attempt $i/6: HTTP $code, waiting 10s..."
            sleep 10
          done

          echo "Deployment health check failed at: $HEALTH_URL"
          exit 1
