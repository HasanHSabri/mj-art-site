# Deploy to Cloudflare Workers
# Push/PR run checks only. Deployment is manual via workflow_dispatch only.
name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'archive/**'
      - '.opencode/**'
      - 'thoughts/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (preview by default; production requires explicit selection)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.validate.outputs.environment }}
    steps:
      - name: Validate exact deployment environment without credentials
        id: validate
        env:
          REQUESTED_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          case "${REQUESTED_ENVIRONMENT}" in
            preview|production) ;;
            *) echo "Deployment environment must be exactly preview or production." >&2; exit 1 ;;
          esac
          printf 'environment=%s\n' "${REQUESTED_ENVIRONMENT}" >> "${GITHUB_OUTPUT}"

  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @mj-art/web build

  deploy:
    runs-on: ubuntu-latest
    needs: [check, gate]
    if: github.event_name == 'workflow_dispatch' && needs.gate.result == 'success'
    environment: ${{ needs.gate.outputs.environment }}
    env:
      TARGET_ENVIRONMENT: ${{ needs.gate.outputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify required secrets are present (fail-closed)
        working-directory: apps/web
        run: |
          set -euo pipefail
          # The three Turnstile bindings are pre-provisioned directly on the
          # selected Worker and are checked by name in the read-only preflight.
          for required in ADMIN_PASSWORD ADMIN_SESSION_SECRET NEON_DATABASE_URL BOOK_EOI_HMAC_KEY BOOK_EOI_ENCRYPTION_KEY; do
            val="${!required}"
            if [ -z "$val" ]; then
              echo "Required secret is empty or missing: $required" >&2
              exit 1
            fi
          done
          # HMAC / encryption secrets must meet the minimum key strength (>= 32
          # chars). The runtime config gate enforces >= 32 *bytes* via UTF-8
          # encoding; this deploy gate is a matching ASCII proxy that blocks an
          # under-strength secret from ever being pushed. The length is never
          # echoed (only a pass/fail message is printed).
          for strong in ADMIN_SESSION_SECRET BOOK_EOI_HMAC_KEY BOOK_EOI_ENCRYPTION_KEY; do
            val="${!strong}"
            if [ "${#val}" -lt 32 ]; then
              echo "Secret is shorter than 32 characters and does not meet the minimum key strength: $strong" >&2
              exit 1
            fi
          done
          echo "All required secrets are present and meet minimum strength."
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BOOK_EOI_HMAC_KEY: ${{ secrets.BOOK_EOI_HMAC_KEY }}
          BOOK_EOI_ENCRYPTION_KEY: ${{ secrets.BOOK_EOI_ENCRYPTION_KEY }}

      - name: Run mutation-free Worker and Books EOI preflight
        working-directory: apps/web
        run: |
          set -euo pipefail
          case "${TARGET_ENVIRONMENT}" in
            preview|production) ;;
            *) echo "Unsupported gated environment." >&2; exit 1 ;;
          esac

          SECRET_NAMES_FILE="${RUNNER_TEMP}/worker-secret-names.json"
          DRY_RUN_DIR="${RUNNER_TEMP}/wrangler-dry-run-${TARGET_ENVIRONMENT}"
          DRY_RUN_LOG="${RUNNER_TEMP}/wrangler-dry-run-${TARGET_ENVIRONMENT}.log"

          pnpm exec wrangler secret list --env "${TARGET_ENVIRONMENT}" --format json > "${SECRET_NAMES_FILE}"
          node --input-type=module - "${SECRET_NAMES_FILE}" <<'NODE'
          import { readFileSync } from 'node:fs';
          const entries = JSON.parse(readFileSync(process.argv[2], 'utf8'));
          const names = new Set(entries.map((entry) => entry.name));
          for (const required of ['TURNSTILE_SITE_KEY', 'TURNSTILE_SECRET_KEY', 'TURNSTILE_WIDGET_FINGERPRINT']) {
            if (!names.has(required)) throw new Error(`required Worker secret name is missing: ${required}`);
          }
          console.log('Required Turnstile Worker secret names are present.');
          NODE

          pnpm exec wrangler deploy --env "${TARGET_ENVIRONMENT}" --dry-run --outdir "${DRY_RUN_DIR}" | tee "${DRY_RUN_LOG}"
          grep -Fq 'BOOK_EOI_RATE_LIMITER' "${DRY_RUN_LOG}"
          grep -Fq 'BOOK_EOI_ENVIRONMENT' "${DRY_RUN_LOG}"
          node ../../scripts/check-book-eoi-schema.mjs --live
          echo "Mutation-free Worker binding, limiter, environment marker, crypto, and live catalog preflight passed."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BOOK_EOI_HMAC_KEY: ${{ secrets.BOOK_EOI_HMAC_KEY }}
          BOOK_EOI_ENCRYPTION_KEY: ${{ secrets.BOOK_EOI_ENCRYPTION_KEY }}

      - name: Ensure selected-environment storage exists
        working-directory: apps/web
        run: |
          set -euo pipefail
          case "${TARGET_ENVIRONMENT}" in
            preview)
              BUCKET="mj-art-images-preview"
              ;;
            production)
              BUCKET="mj-art-images"
              ;;
            *)
              echo "Unsupported gated environment." >&2
              exit 1
              ;;
          esac
          pnpm exec wrangler r2 bucket create "$BUCKET" --location apac || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Configure admin secrets
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${TARGET_ENVIRONMENT}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported gated environment." >&2
              exit 1
              ;;
          esac

          printf '%s' "$ADMIN_PASSWORD" | pnpm exec wrangler secret put ADMIN_PASSWORD "${deploy_args[@]}"
          printf '%s' "$ADMIN_SESSION_SECRET" | pnpm exec wrangler secret put ADMIN_SESSION_SECRET "${deploy_args[@]}"
          printf '%s' "$NEON_DATABASE_URL" | pnpm exec wrangler secret put NEON_DATABASE_URL "${deploy_args[@]}"
          printf '%s' "$BOOK_EOI_HMAC_KEY" | pnpm exec wrangler secret put BOOK_EOI_HMAC_KEY "${deploy_args[@]}"
          printf '%s' "$BOOK_EOI_ENCRYPTION_KEY" | pnpm exec wrangler secret put BOOK_EOI_ENCRYPTION_KEY "${deploy_args[@]}"
          # Turnstile site key, secret, and pair fingerprint are intentionally
          # excluded: the guarded provisioning workflow owns those bindings.
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BOOK_EOI_HMAC_KEY: ${{ secrets.BOOK_EOI_HMAC_KEY }}
          BOOK_EOI_ENCRYPTION_KEY: ${{ secrets.BOOK_EOI_ENCRYPTION_KEY }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${TARGET_ENVIRONMENT}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported gated environment." >&2
              exit 1
              ;;
          esac

          pnpm exec wrangler deploy "${deploy_args[@]}" | tee deploy.log

          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            case "${TARGET_ENVIRONMENT}" in
              preview)
                DEPLOY_URL="https://mj-art-preview.drhasansabri.workers.dev"
                ;;
              production)
                DEPLOY_URL="https://mj-art.drhasansabri.workers.dev"
                ;;
              *)
                echo "Unsupported gated environment." >&2
                exit 1
                ;;
            esac
          fi

          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          sleep 15

          URL="$DEPLOY_URL"

          # 1) Liveness: /api/health.
          HEALTH_URL="$URL/api/health"

          echo "Checking deployment health at: $HEALTH_URL"

          for i in {1..6}; do
            response=$(curl -sS -w "\n%{http_code}" "$HEALTH_URL" || echo -e "\n000")
            code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')

            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"healthy"'; then
              echo "Deployment verified successfully!"
              break
            fi

            if [ "$i" = "6" ]; then
              echo "Deployment health check failed at: $HEALTH_URL"
              exit 1
            fi

            echo "Attempt $i/6: HTTP $code, waiting 10s..."
            sleep 10
          done

          # 2) Books EOI post-deploy smoke verifies the three Turnstile bindings
          # form the provisioned pair, the limiter interface and environment
          # marker exist, DB/crypto/action/host config is complete, and the live
          # Neon schema matches. It reveals only healthy|mismatch|unavailable.
          BOOKS_HEALTH_URL="$URL/api/books/health"

          echo "Checking Books EOI configuration + schema at: $BOOKS_HEALTH_URL"

          for i in {1..6}; do
            response=$(curl -sS -w "\n%{http_code}" "$BOOKS_HEALTH_URL" || echo -e "\n000")
            code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')

            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"healthy"'; then
              echo "Books EOI configuration and schema verified successfully!"
              exit 0
            fi

            if [ "$i" = "6" ]; then
              echo "Books EOI post-deploy smoke failed at: $BOOKS_HEALTH_URL"
              echo "The already-live release failed its Turnstile/limiter/DB/crypto/schema post-smoke; this workflow does not roll back."
              exit 1
            fi

            echo "Attempt $i/6: HTTP $code, waiting 10s..."
            sleep 10
          done
