# Deploy to Cloudflare Workers
# Push/PR run checks only. Deployment is manual via workflow_dispatch only.
name: Deploy to Cloudflare

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'archive/**'
      - '.opencode/**'
      - 'thoughts/**'
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (preview by default; production requires explicit selection)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm type-check

      - name: Run lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

      - name: Build web app
        run: pnpm --filter @mj-art/web build

  deploy:
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'workflow_dispatch'
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure selected-environment storage exists
        working-directory: apps/web
        run: |
          set -euo pipefail
          # Create/validate ONLY the bucket for the SELECTED environment. A preview
          # deploy must never target or create the production bucket (and vice
          # versa). inputs.environment is a constrained choice (preview|production),
          # so the case is exhaustive with a fail-closed default.
          case "${{ inputs.environment }}" in
            preview)
              BUCKET="mj-art-images-preview"
              ;;
            production)
              BUCKET="mj-art-images"
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac
          # Idempotent: succeeds if the bucket exists, fails harmlessly if it
          # already does. Only the selected bucket is touched.
          pnpm exec wrangler r2 bucket create "$BUCKET" --location apac || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify required secrets are present (fail-closed)
        working-directory: apps/web
        run: |
          set -euo pipefail
          for required in ADMIN_PASSWORD ADMIN_SESSION_SECRET NEON_DATABASE_URL BOOK_EOI_HMAC_KEY BOOK_EOI_ENCRYPTION_KEY TURNSTILE_SECRET_KEY; do
            val="${!required}"
            if [ -z "$val" ]; then
              echo "Required secret is empty or missing: $required" >&2
              exit 1
            fi
          done
          # HMAC / encryption secrets must meet the minimum key strength (>= 32
          # chars). The runtime config gate enforces >= 32 *bytes* via UTF-8
          # encoding; this deploy gate is a matching ASCII proxy that blocks an
          # under-strength secret from ever being pushed. The length is never
          # echoed (only a pass/fail message is printed).
          for strong in ADMIN_SESSION_SECRET BOOK_EOI_HMAC_KEY BOOK_EOI_ENCRYPTION_KEY; do
            val="${!strong}"
            if [ "${#val}" -lt 32 ]; then
              echo "Secret is shorter than 32 characters and does not meet the minimum key strength: $strong" >&2
              exit 1
            fi
          done
          echo "All required secrets are present and meet minimum strength."
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BOOK_EOI_HMAC_KEY: ${{ secrets.BOOK_EOI_HMAC_KEY }}
          BOOK_EOI_ENCRYPTION_KEY: ${{ secrets.BOOK_EOI_ENCRYPTION_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Configure admin secrets
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${{ inputs.environment }}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

          printf '%s' "$ADMIN_PASSWORD" | pnpm exec wrangler secret put ADMIN_PASSWORD "${deploy_args[@]}"
          printf '%s' "$ADMIN_SESSION_SECRET" | pnpm exec wrangler secret put ADMIN_SESSION_SECRET "${deploy_args[@]}"
          printf '%s' "$NEON_DATABASE_URL" | pnpm exec wrangler secret put NEON_DATABASE_URL "${deploy_args[@]}"
          printf '%s' "$BOOK_EOI_HMAC_KEY" | pnpm exec wrangler secret put BOOK_EOI_HMAC_KEY "${deploy_args[@]}"
          printf '%s' "$BOOK_EOI_ENCRYPTION_KEY" | pnpm exec wrangler secret put BOOK_EOI_ENCRYPTION_KEY "${deploy_args[@]}"
          printf '%s' "$TURNSTILE_SECRET_KEY" | pnpm exec wrangler secret put TURNSTILE_SECRET_KEY "${deploy_args[@]}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          ADMIN_SESSION_SECRET: ${{ secrets.ADMIN_SESSION_SECRET }}
          NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          BOOK_EOI_HMAC_KEY: ${{ secrets.BOOK_EOI_HMAC_KEY }}
          BOOK_EOI_ENCRYPTION_KEY: ${{ secrets.BOOK_EOI_ENCRYPTION_KEY }}
          TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}

      - name: Deploy to Cloudflare Workers
        working-directory: apps/web
        run: |
          deploy_args=()

          case "${{ inputs.environment }}" in
            preview)
              deploy_args+=(--env preview)
              ;;
            production)
              deploy_args+=(--env production)
              ;;
            *)
              echo "Unsupported environment: ${{ inputs.environment }}" >&2
              exit 1
              ;;
          esac

          pnpm exec wrangler deploy "${deploy_args[@]}" | tee deploy.log

          DEPLOY_URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' deploy.log | tail -n 1 || true)
          if [ -z "$DEPLOY_URL" ]; then
            case "${{ inputs.environment }}" in
              preview)
                DEPLOY_URL="https://mj-art-preview.drhasansabri.workers.dev"
                ;;
              production)
                DEPLOY_URL="https://mj-art.drhasansabri.workers.dev"
                ;;
              *)
                echo "Unsupported environment: ${{ inputs.environment }}" >&2
                exit 1
                ;;
            esac
          fi

          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify deployment
        run: |
          sleep 15

          URL="$DEPLOY_URL"

          HEALTH_URL="$URL/api/health"

          echo "Checking deployment health at: $HEALTH_URL"

          for i in {1..6}; do
            response=$(curl -sS -w "\n%{http_code}" "$HEALTH_URL" || echo -e "\n000")
            code=$(echo "$response" | tail -n 1)
            body=$(echo "$response" | sed '$d')

            if [ "$code" = "200" ] && echo "$body" | grep -q '"status":"healthy"'; then
              echo "Deployment verified successfully!"
              exit 0
            fi

            echo "Attempt $i/6: HTTP $code, waiting 10s..."
            sleep 10
          done

          echo "Deployment health check failed at: $HEALTH_URL"
          exit 1
